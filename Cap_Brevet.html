<body><a class="skip" href="#main">Aller au contenu</a><div id="storage-warning" class="storage-warning hidden" role="status"></div><div class="layout"><aside class="sidebar" aria-label="Navigation principale"><div class="brand"><span class="compass" aria-hidden="true">✧</span><span>CAP<br> BREVET</span></div><nav id="nav"></nav><div class="tools" id="tools"></div></aside><main class="main" id="main" tabindex="-1"></main></div><dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button data-action="close-modal" aria-label="Fermer la fenêtre">✕</button></div><div id="modal-body" class="modal-body"></div></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><script>const LESSONS=[{"id": "3e-fr-0", "grade": "3e", "subject": "fr", "title": "Grammaire et fonctions", "body": "Distingue la nature d’un mot (ce qu’il est) de sa fonction (son rôle). Une subordonnée relative complète un nom et commence par un pronom relatif. Le COD répond à qui ? ou quoi ? après le verbe, sans préposition.", "example": "Dans « Je lis le livre que tu conseilles », que tu conseilles complète livre.", "widget": "", "stage": 0, "questions": [{"id": "3e-fr-0-q0", "prompt": "Dans « Elle parle calmement », quelle est la nature de calmement ?", "answer": "adverbe", "options": ["adverbe", "adjectif", "nom"], "explanation": "Calmement modifie le verbe parle ; c’est un adverbe.", "strict": true}, {"id": "3e-fr-0-q1", "prompt": "Dans « Elle lit un roman », quelle est la fonction de un roman ?", "answer": "COD", "options": ["COD", "sujet", "attribut du sujet"], "explanation": "Elle lit quoi ? Un roman : complément d’objet direct.", "strict": true}, {"id": "3e-fr-0-q2", "prompt": "Dans « Le livre que tu lis est passionnant », quelle est la proposition relative ?", "answer": "que tu lis", "options": ["que tu lis", "est passionnant", "Le livre"], "explanation": "La relative est introduite par que et complète le nom livre.", "strict": true}, {"id": "3e-fr-0-q3", "prompt": "Dans « Cette histoire semble vraie », quelle est la fonction de vraie ?", "answer": "attribut du sujet", "options": ["attribut du sujet", "COD", "complément du nom"], "explanation": "Après le verbe d’état semble, vraie caractérise le sujet histoire.", "strict": true}, {"id": "3e-fr-0-q4", "prompt": "Dans « Lorsque la nuit tombe, je rentre », la subordonnée exprime…", "answer": "le temps", "options": ["le temps", "la cause", "le but"], "explanation": "Lorsque introduit une relation temporelle.", "strict": true}]}, {"id": "3e-fr-1", "grade": "3e", "subject": "fr", "title": "Accords, temps et réécriture", "body": "Avec être, le participe passé s’accorde avec le sujet. Avec avoir, il s’accorde avec le COD si celui-ci est placé avant. L’imparfait décrit souvent le cadre ; le passé simple présente des événements de premier plan dans un récit.", "example": "Les lettres que j’ai écrites : que reprend lettres, COD placé avant ai écrites.", "widget": "", "stage": 1, "questions": [{"id": "3e-fr-1-q0", "prompt": "Complète : Les lettres que j’ai …", "answer": "écrites", "options": ["écrites", "écrit", "écrits"], "explanation": "Le COD que, féminin pluriel, est placé avant le verbe avec avoir.", "strict": true}, {"id": "3e-fr-1-q1", "prompt": "Complète : Elles sont … tôt.", "answer": "parties", "options": ["parties", "parti", "partis"], "explanation": "Avec être, parties s’accorde avec le sujet elles.", "strict": true}, {"id": "3e-fr-1-q2", "prompt": "Quel est le temps de « il marchait » ?", "answer": "imparfait", "options": ["imparfait", "passé simple", "conditionnel présent"], "explanation": "La terminaison -ait indique ici l’imparfait.", "strict": true}, {"id": "3e-fr-1-q3", "prompt": "Réécris « Elle est heureuse » au pluriel féminin.", "answer": "Elles sont heureuses", "options": ["Elles sont heureuses", "Elles est heureuse", "Elles sont heureux"], "explanation": "Le sujet, le verbe et l’adjectif changent au pluriel féminin.", "strict": true}, {"id": "3e-fr-1-q4", "prompt": "Complète au conditionnel présent : Si j’avais le temps, je …", "answer": "viendrais", "options": ["viendrais", "viendrai", "venais"], "explanation": "Après si + imparfait, la conséquence hypothétique est au conditionnel.", "strict": true}]}, {"id": "3e-fr-2", "grade": "3e", "subject": "fr", "title": "Lire et interpréter un texte", "body": "Appuie chaque interprétation sur un indice précis. Une comparaison utilise un outil comme tel ou comme ; une métaphore rapproche sans outil. Le narrateur raconte, l’auteur écrit : ils ne sont pas automatiquement identiques.", "example": "« La ville est une fourmilière » est une métaphore qui suggère une activité intense.", "widget": "", "stage": 2, "questions": [{"id": "3e-fr-2-q0", "prompt": "Quelle figure reconnaît-on dans « Il court comme le vent » ?", "answer": "comparaison", "options": ["comparaison", "anaphore", "oxymore"], "explanation": "Comme est l’outil qui rapproche la course du vent.", "strict": true}, {"id": "3e-fr-2-q1", "prompt": "Quelle figure reconnaît-on dans « Cette obscure clarté » ?", "answer": "oxymore", "options": ["oxymore", "hyperbole", "comparaison"], "explanation": "Deux termes de sens opposés sont rapprochés dans un même groupe.", "strict": true}, {"id": "3e-fr-2-q2", "prompt": "Le narrateur est-il toujours l’auteur ?", "answer": "Non", "options": ["Non", "Oui", "Seulement au théâtre"], "explanation": "Le narrateur est une voix du récit, distincte de la personne réelle de l’auteur.", "strict": true}, {"id": "3e-fr-2-q3", "prompt": "Quel indice établit une focalisation interne ?", "answer": "Les pensées d’un personnage sont connues", "options": ["Les pensées d’un personnage sont connues", "Seuls des gestes sont décrits", "Tous les personnages sont omniscients"], "explanation": "La focalisation interne limite les informations au point de vue d’un personnage.", "strict": true}, {"id": "3e-fr-2-q4", "prompt": "Pour justifier une interprétation, il faut…", "answer": "citer un indice et l’expliquer", "options": ["citer un indice et l’expliquer", "copier tout le texte", "donner uniquement son avis"], "explanation": "Une citation courte doit être reliée à l’idée que tu défends.", "strict": true}]}, {"id": "3e-fr-3", "grade": "3e", "subject": "fr", "title": "Argumenter et organiser sa rédaction", "body": "Lis le sujet, identifie la consigne et construis un plan au brouillon. Dans une réflexion, chaque paragraphe développe une idée avec argument et exemple. Relis ensuite les accords, les temps et la ponctuation.", "example": "Idée : la lecture ouvre à d’autres expériences. Exemple : un récit fait comprendre le point de vue d’un personnage éloigné de nous.", "widget": "", "stage": 3, "questions": [{"id": "3e-fr-3-q0", "prompt": "Quel connecteur exprime une opposition ?", "answer": "cependant", "options": ["cependant", "donc", "par conséquent"], "explanation": "Cependant introduit une réserve ou une opposition.", "strict": true}, {"id": "3e-fr-3-q1", "prompt": "Une thèse est…", "answer": "une idée défendue", "options": ["une idée défendue", "un exemple seulement", "un signe de ponctuation"], "explanation": "La thèse est la position soutenue par l’argumentation.", "strict": true}, {"id": "3e-fr-3-q2", "prompt": "Quel ordre convient à un paragraphe argumentatif ?", "answer": "idée, explication, exemple", "options": ["idée, explication, exemple", "exemple sans lien, conclusion", "citation seule"], "explanation": "L’idée est développée puis rendue concrète par un exemple.", "strict": true}, {"id": "3e-fr-3-q3", "prompt": "Dans un récit au passé, pourquoi vérifier les temps ?", "answer": "pour conserver une cohérence temporelle", "options": ["pour conserver une cohérence temporelle", "pour tout mettre au présent", "pour supprimer tous les verbes"], "explanation": "Les changements de temps doivent correspondre à un effet ou un repère temporel.", "strict": true}, {"id": "3e-fr-3-q4", "prompt": "À la fin d’une rédaction, il faut…", "answer": "relire le fond et la langue", "options": ["relire le fond et la langue", "compter uniquement les lignes", "ajouter des idées sans lien"], "explanation": "La relecture vérifie aussi la réponse au sujet et la construction du texte.", "strict": true}]}, {"id": "3e-math-0", "grade": "3e", "subject": "math", "title": "Calcul, fractions et puissances", "body": "Respecte les priorités : parenthèses, puissances, multiplications/divisions, additions/soustractions. Pour additionner des fractions, utilise un dénominateur commun. Une puissance négative correspond à un inverse.", "example": "2³ × 2⁴ = 2⁷. Et 1/2 + 1/3 = 3/6 + 2/6 = 5/6.", "widget": "", "stage": 0, "questions": [{"id": "3e-math-0-q0", "prompt": "Calcule 3 + 4 × 2.", "answer": "11", "options": ["11", "14", "10"], "explanation": "La multiplication est prioritaire : 3 + 8 = 11.", "strict": false}, {"id": "3e-math-0-q1", "prompt": "Calcule 1/2 + 1/3 et donne la fraction irréductible.", "answer": "5/6", "options": ["5/6", "2/5", "1/6"], "explanation": "Le dénominateur commun est 6 : 3/6 + 2/6 = 5/6.", "strict": false}, {"id": "3e-math-0-q2", "prompt": "Calcule 2³ × 2².", "answer": "32", "options": ["32", "64", "16"], "explanation": "On additionne les exposants : 2 puissance 5 = 32.", "strict": false}, {"id": "3e-math-0-q3", "prompt": "Calcule 10 puissance −2.", "answer": "0,01", "options": ["0,01", "−100", "0,1"], "explanation": "10 puissance −2 vaut 1/100.", "strict": false}, {"id": "3e-math-0-q4", "prompt": "Un prix de 80 € baisse de 15 %. Quel est le nouveau prix en euros ?", "answer": "68", "options": ["68", "65", "92"], "explanation": "15 % de 80 vaut 12 ; le nouveau prix est 80 − 12 = 68.", "strict": false}]}, {"id": "3e-math-1", "grade": "3e", "subject": "math", "title": "Équations et fonctions", "body": "Résoudre une équation consiste à trouver les valeurs qui rendent l’égalité vraie. On effectue la même opération des deux côtés. Pour f(x), l’image de a est f(a) ; un antécédent de b est une valeur x telle que f(x)=b.", "example": "Si f(x)=3x−2, l’image de 4 est 10 et l’antécédent de 7 est 3.", "widget": "", "stage": 1, "questions": [{"id": "3e-math-1-q0", "prompt": "Résous 3x + 5 = 20.", "answer": "5", "options": ["5", "15", "25"], "explanation": "On soustrait 5 puis on divise par 3 : x = 5.", "strict": false}, {"id": "3e-math-1-q1", "prompt": "Développe 2(x + 3).", "answer": "2x + 6", "options": ["2x + 6", "2x + 3", "5x"], "explanation": "On distribue 2 à chacun des deux termes.", "strict": false}, {"id": "3e-math-1-q2", "prompt": "Factorise 5x + 15.", "answer": "5(x + 3)", "options": ["5(x + 3)", "5(x + 15)", "x(5 + 15)"], "explanation": "Le facteur commun est 5.", "strict": false}, {"id": "3e-math-1-q3", "prompt": "Pour f(x)=2x+1, quelle est l’image de 4 ?", "answer": "9", "options": ["9", "8", "3"], "explanation": "f(4) = 2 × 4 + 1 = 9.", "strict": false}, {"id": "3e-math-1-q4", "prompt": "Pour f(x)=2x+1, quel est l’antécédent de 7 ?", "answer": "3", "options": ["3", "15", "7"], "explanation": "On résout 2x + 1 = 7, donc x = 3.", "strict": false}]}, {"id": "3e-math-2", "grade": "3e", "subject": "math", "title": "Géométrie et démonstration", "body": "Dans un triangle rectangle, le carré de l’hypoténuse égale la somme des carrés des deux autres côtés. La réciproque de Pythagore sert à prouver qu’un triangle est rectangle. Thalès nécessite des alignements et des droites parallèles.", "example": "Si les côtés de l’angle droit mesurent 3 et 4 cm, l’hypoténuse mesure 5 cm car 9 + 16 = 25.", "widget": "", "stage": 2, "questions": [{"id": "3e-math-2-q0", "prompt": "Un triangle rectangle a pour côtés de l’angle droit 6 et 8 cm. Quelle est son hypoténuse en cm ?", "answer": "10", "options": ["10", "14", "48"], "explanation": "6² + 8² = 100, donc l’hypoténuse vaut 10 cm.", "strict": false}, {"id": "3e-math-2-q1", "prompt": "Un triangle de côtés 5, 12 et 13 cm est-il rectangle ?", "answer": "Oui", "options": ["Oui", "Non", "Impossible à savoir"], "explanation": "5² + 12² = 169 = 13² : la réciproque de Pythagore s’applique.", "strict": false}, {"id": "3e-math-2-q2", "prompt": "Dans un triangle rectangle, cosinus d’un angle aigu = …", "answer": "adjacent / hypoténuse", "options": ["adjacent / hypoténuse", "opposé / adjacent", "hypoténuse / adjacent"], "explanation": "Le cosinus est le rapport du côté adjacent à l’hypoténuse.", "strict": false}, {"id": "3e-math-2-q3", "prompt": "Un agrandissement multiplie les longueurs par 3. Par combien multiplie-t-il les aires ?", "answer": "9", "options": ["9", "3", "6"], "explanation": "Les aires sont multipliées par le carré du coefficient : 3² = 9.", "strict": false}, {"id": "3e-math-2-q4", "prompt": "Pour appliquer Thalès, il faut notamment vérifier…", "answer": "le parallélisme des droites concernées", "options": ["le parallélisme des droites concernées", "que le triangle est rectangle", "que les trois côtés sont égaux"], "explanation": "Les alignements et le parallélisme sont les hypothèses essentielles.", "strict": false}]}, {"id": "3e-math-3", "grade": "3e", "subject": "math", "title": "Statistiques, probabilités et algorithmes", "body": "Une moyenne est la somme des valeurs divisée par l’effectif. Une probabilité est comprise entre 0 et 1. En situation d’équiprobabilité, elle est le nombre d’issues favorables divisé par le nombre total d’issues. Une boucle répète des instructions.", "example": "Pour 4, 8 et 9, la moyenne est 7. Pour un dé équilibré, P(nombre pair)=3/6=1/2.", "widget": "", "stage": 3, "questions": [{"id": "3e-math-3-q0", "prompt": "Quelle est la médiane de 2, 4, 7, 9, 13 ?", "answer": "7", "options": ["7", "9", "4"], "explanation": "La médiane est la valeur centrale de cette série ordonnée.", "strict": false}, {"id": "3e-math-3-q1", "prompt": "Quelle est la moyenne de 6, 10 et 14 ?", "answer": "10", "options": ["10", "12", "9"], "explanation": "La somme vaut 30 et l’effectif 3 : 30/3 = 10.", "strict": false}, {"id": "3e-math-3-q2", "prompt": "Avec un dé équilibré à six faces, quelle est la probabilité d’obtenir 6 ?", "answer": "1/6", "options": ["1/6", "6", "1/2"], "explanation": "Une seule issue favorable parmi six issues équiprobables.", "strict": false}, {"id": "3e-math-3-q3", "prompt": "Une variable vaut 2, puis on lui ajoute 3 quatre fois. Quelle est sa valeur finale ?", "answer": "14", "options": ["14", "20", "9"], "explanation": "On calcule 2 + 4 × 3 = 14.", "strict": false}, {"id": "3e-math-3-q4", "prompt": "Si P(A)=0,3, quelle est la probabilité de l’événement contraire ?", "answer": "0,7", "options": ["0,7", "1,3", "0,3"], "explanation": "Les probabilités d’un événement et de son contraire ont pour somme 1.", "strict": false}]}, {"id": "3e-hg-0", "grade": "3e", "subject": "hg", "title": "Guerres mondiales et totalitarismes", "body": "La Première Guerre mondiale (1914–1918) est une guerre totale mobilisant soldats, civils et économies. La Seconde (1939–1945) est une guerre d’anéantissement, marquée par le génocide des Juifs et des Tsiganes. Les régimes totalitaires cherchent à contrôler la société.", "example": "Pour analyser un document : identifie nature, auteur, date, contexte, puis confronte les informations à tes connaissances.", "widget": "", "stage": 0, "questions": [{"id": "3e-hg-0-q0", "prompt": "Quand débute la Première Guerre mondiale ?", "answer": "1914", "options": ["1914", "1918", "1939"], "explanation": "La guerre débute en 1914 et s’achève en 1918.", "strict": false}, {"id": "3e-hg-0-q1", "prompt": "Quelle date correspond à l’armistice de la Première Guerre mondiale ?", "answer": "11 novembre 1918", "options": ["11 novembre 1918", "8 mai 1945", "18 juin 1940"], "explanation": "Le 11 novembre 1918 marque l’armistice sur le front occidental.", "strict": false}, {"id": "3e-hg-0-q2", "prompt": "Qui dirige l’URSS dans les années 1930 ?", "answer": "Staline", "options": ["Staline", "Hitler", "Mussolini"], "explanation": "Staline impose un régime totalitaire en URSS.", "strict": false}, {"id": "3e-hg-0-q3", "prompt": "Que désigne la Shoah ?", "answer": "le génocide des Juifs d’Europe", "options": ["le génocide des Juifs d’Europe", "la bataille de Verdun", "la crise de 1929"], "explanation": "La Shoah désigne le génocide des Juifs perpétré par les nazis et leurs collaborateurs.", "strict": false}, {"id": "3e-hg-0-q4", "prompt": "Pourquoi parle-t-on de guerre totale ?", "answer": "Toute la société et l’économie sont mobilisées", "options": ["Toute la société et l’économie sont mobilisées", "Seuls les soldats sont concernés", "Tous les pays sont neutres"], "explanation": "Les civils, la production et les finances participent à l’effort de guerre.", "strict": false}]}, {"id": "3e-hg-1", "grade": "3e", "subject": "hg", "title": "Monde depuis 1945 et République", "body": "Après 1945, les États-Unis et l’URSS s’opposent pendant la guerre froide. La décolonisation conduit à de nouveaux États indépendants. En France, la Ve République naît en 1958. L’Europe se construit progressivement autour de coopérations économiques et politiques.", "example": "Distingue une date-repère, l’événement associé et sa portée : 1989, chute du mur de Berlin, symbole de la fin de la division de l’Europe.", "widget": "", "stage": 1, "questions": [{"id": "3e-hg-1-q0", "prompt": "En quelle année l’ONU est-elle créée ?", "answer": "1945", "options": ["1945", "1914", "1958"], "explanation": "L’Organisation des Nations unies est créée après la Seconde Guerre mondiale.", "strict": false}, {"id": "3e-hg-1-q1", "prompt": "Quels États dominent les deux blocs de la guerre froide ?", "answer": "États-Unis et URSS", "options": ["États-Unis et URSS", "France et Italie", "Chine et Japon"], "explanation": "Les deux superpuissances s’opposent sans affrontement militaire direct généralisé.", "strict": false}, {"id": "3e-hg-1-q2", "prompt": "En quelle année le mur de Berlin tombe-t-il ?", "answer": "1989", "options": ["1989", "1961", "1945"], "explanation": "La chute du mur intervient en novembre 1989.", "strict": false}, {"id": "3e-hg-1-q3", "prompt": "En quelle année débute la Ve République ?", "answer": "1958", "options": ["1958", "1946", "1968"], "explanation": "La Constitution de 1958 fonde la Ve République.", "strict": false}, {"id": "3e-hg-1-q4", "prompt": "Que désigne la décolonisation ?", "answer": "l’accès à l’indépendance de territoires colonisés", "options": ["l’accès à l’indépendance de territoires colonisés", "une alliance militaire", "une crise boursière"], "explanation": "Les peuples colonisés obtiennent leur indépendance selon des processus variés.", "strict": false}]}, {"id": "3e-hg-2", "grade": "3e", "subject": "hg", "title": "Territoires français et Europe", "body": "Les aires urbaines concentrent populations, emplois et services. Les espaces productifs évoluent avec la mondialisation. L’aménagement cherche à réduire les inégalités territoriales ; les territoires ultramarins présentent des contraintes et des atouts spécifiques.", "example": "Dans un développement construit, formule une idée, explique-la et cite un exemple localisé.", "widget": "", "stage": 2, "questions": [{"id": "3e-hg-2-q0", "prompt": "La métropolisation désigne…", "answer": "la concentration des activités de commandement dans les grandes villes", "options": ["la concentration des activités de commandement dans les grandes villes", "la disparition des villes", "l’augmentation exclusive des emplois agricoles"], "explanation": "Les grandes villes concentrent emplois qualifiés et fonctions de commandement.", "strict": false}, {"id": "3e-hg-2-q1", "prompt": "La périurbanisation correspond à…", "answer": "l’extension de l’habitat autour des villes", "options": ["l’extension de l’habitat autour des villes", "la concentration des glaciers", "la disparition des déplacements"], "explanation": "Les espaces périphériques accueillent des habitants souvent liés à la ville-centre.", "strict": false}, {"id": "3e-hg-2-q2", "prompt": "Quel territoire français est situé en Amérique du Sud ?", "answer": "la Guyane", "options": ["la Guyane", "la Réunion", "la Corse"], "explanation": "La Guyane est un territoire français sur le continent sud-américain.", "strict": false}, {"id": "3e-hg-2-q3", "prompt": "Quel est un objectif de l’aménagement du territoire ?", "answer": "réduire les inégalités d’accès aux services", "options": ["réduire les inégalités d’accès aux services", "supprimer tous les transports", "concentrer tous les habitants à Paris"], "explanation": "L’aménagement vise notamment une meilleure cohésion territoriale.", "strict": false}, {"id": "3e-hg-2-q4", "prompt": "La France appartient-elle à l’Union européenne ?", "answer": "Oui", "options": ["Oui", "Non", "Seulement depuis 2020"], "explanation": "La France participe à la construction européenne depuis ses origines.", "strict": false}]}, {"id": "3e-hg-3", "grade": "3e", "subject": "hg", "title": "EMC et esprit critique", "body": "La République française est indivisible, laïque, démocratique et sociale. La laïcité garantit la liberté de conscience et la neutralité de l’État. Pour vérifier une information, croise les sources, cherche l’auteur et la date et distingue fait et opinion.", "example": "Un chiffre partagé sur un réseau social doit être replacé dans son contexte : source, date, population étudiée et méthode.", "widget": "", "stage": 3, "questions": [{"id": "3e-hg-3-q0", "prompt": "Quelle est la devise de la République française ?", "answer": "Liberté, Égalité, Fraternité", "options": ["Liberté, Égalité, Fraternité", "Travail, Famille, Patrie", "Unité, Force, Richesse"], "explanation": "La devise républicaine associe liberté, égalité et fraternité.", "strict": false}, {"id": "3e-hg-3-q1", "prompt": "La laïcité garantit notamment…", "answer": "la liberté de conscience", "options": ["la liberté de conscience", "l’interdiction de toute croyance", "une religion officielle"], "explanation": "Elle garantit la liberté de conscience et la neutralité de l’État.", "strict": false}, {"id": "3e-hg-3-q2", "prompt": "Le Parlement a notamment pour rôle de…", "answer": "voter la loi", "options": ["voter la loi", "juger les crimes", "nommer tous les maires"], "explanation": "En France, le Parlement vote les lois et contrôle l’action du gouvernement.", "strict": false}, {"id": "3e-hg-3-q3", "prompt": "Avant de partager une information, il faut…", "answer": "croiser des sources fiables", "options": ["croiser des sources fiables", "se fier au nombre de likes", "supprimer la date"], "explanation": "La popularité d’un contenu ne prouve pas sa véracité.", "strict": false}, {"id": "3e-hg-3-q4", "prompt": "Une discrimination est…", "answer": "un traitement défavorable lié à un critère interdit par la loi", "options": ["un traitement défavorable lié à un critère interdit par la loi", "tout désaccord", "un vote à bulletin secret"], "explanation": "L’origine, le sexe ou le handicap sont notamment des critères protégés.", "strict": false}]}, {"id": "3e-sci-0", "grade": "3e", "subject": "sci", "title": "Physique-chimie : mouvement et énergie", "body": "La vitesse moyenne est la distance divisée par la durée, avec des unités cohérentes. L’énergie se conserve lors des conversions, même si une part est dissipée sous forme thermique. La puissance est une énergie transférée par unité de temps.", "example": "Pour 150 km en 2 h, v = 150/2 = 75 km/h. E = P × t ; avec W et s, E est en joules.", "widget": "", "stage": 0, "questions": [{"id": "3e-sci-0-q0", "prompt": "Une voiture parcourt 120 km en 2 h. Quelle est sa vitesse moyenne en km/h ?", "answer": "60", "options": ["60", "240", "122"], "explanation": "La vitesse moyenne est 120/2 = 60 km/h.", "strict": false}, {"id": "3e-sci-0-q1", "prompt": "Quelle est l’unité SI de l’énergie ?", "answer": "joule", "options": ["joule", "watt", "volt"], "explanation": "Le joule mesure une énergie ; le watt mesure une puissance.", "strict": false}, {"id": "3e-sci-0-q2", "prompt": "Quelle relation relie énergie E, puissance P et durée t ?", "answer": "E = P × t", "options": ["E = P × t", "E = P / t", "E = t / P"], "explanation": "À puissance constante, l’énergie transférée est proportionnelle à la durée.", "strict": false}, {"id": "3e-sci-0-q3", "prompt": "Une lampe électrique convertit l’énergie électrique notamment en…", "answer": "énergie lumineuse et thermique", "options": ["énergie lumineuse et thermique", "matière nouvelle", "énergie nucléaire"], "explanation": "Une partie de l’énergie est émise comme lumière et une autre comme chaleur.", "strict": false}, {"id": "3e-sci-0-q4", "prompt": "Un objet parcourt 30 m en 5 s. Quelle est sa vitesse moyenne en m/s ?", "answer": "6", "options": ["6", "150", "25"], "explanation": "On divise la distance par la durée : 30/5 = 6 m/s.", "strict": false}]}, {"id": "3e-sci-1", "grade": "3e", "subject": "sci", "title": "Physique-chimie : matière et électricité", "body": "Un atome possède un noyau et des électrons. Un ion est électriquement chargé. Le pH caractérise l’acidité d’une solution aqueuse. Pour un conducteur ohmique, U = R × I, avec U en volts, R en ohms et I en ampères.", "example": "Une solution de pH 3 est acide. Une résistance de 20 Ω traversée par 0,1 A a une tension de 2 V.", "widget": "", "stage": 1, "questions": [{"id": "3e-sci-1-q0", "prompt": "Une solution aqueuse de pH 2 est…", "answer": "acide", "options": ["acide", "basique", "neutre"], "explanation": "Une solution dont le pH est inférieur à 7 est acide dans les conditions usuelles.", "strict": false}, {"id": "3e-sci-1-q1", "prompt": "Un ion est une espèce…", "answer": "électriquement chargée", "options": ["électriquement chargée", "toujours neutre", "sans noyau"], "explanation": "Un ion a gagné ou perdu un ou plusieurs électrons.", "strict": false}, {"id": "3e-sci-1-q2", "prompt": "Quelle relation exprime la loi d’Ohm ?", "answer": "U = R × I", "options": ["U = R × I", "R = U × I", "I = R × U"], "explanation": "Pour un conducteur ohmique, la tension est proportionnelle à l’intensité.", "strict": false}, {"id": "3e-sci-1-q3", "prompt": "Avec R=10 Ω et I=0,2 A, combien vaut U en volts ?", "answer": "2", "options": ["2", "50", "0,02"], "explanation": "U = 10 × 0,2 = 2 V.", "strict": false}, {"id": "3e-sci-1-q4", "prompt": "Lors d’une réaction chimique, les atomes…", "answer": "se réorganisent", "options": ["se réorganisent", "disparaissent tous", "se transforment tous en électrons"], "explanation": "Les espèces changent mais les atomes se conservent et se réorganisent.", "strict": false}]}, {"id": "3e-sci-2", "grade": "3e", "subject": "sci", "title": "SVT : vivant, santé et planète", "body": "L’ADN porte une information génétique. La biodiversité varie et évolue. La vaccination prépare une réponse immunitaire spécifique. Les activités humaines modifient le climat en renforçant l’effet de serre. Distingue observation, hypothèse, expérience et conclusion.", "example": "Pour conclure à partir d’un graphique, décris d’abord la variation avec des valeurs et des unités, puis propose une explication argumentée.", "widget": "", "stage": 2, "questions": [{"id": "3e-sci-2-q0", "prompt": "Quelle molécule porte l’information génétique ?", "answer": "ADN", "options": ["ADN", "eau", "dioxygène"], "explanation": "L’ADN contient l’information génétique des êtres vivants.", "strict": false}, {"id": "3e-sci-2-q1", "prompt": "La vaccination permet notamment…", "answer": "de préparer une mémoire immunitaire", "options": ["de préparer une mémoire immunitaire", "de remplacer tous les globules rouges", "de guérir automatiquement toutes les infections"], "explanation": "Elle prépare une réponse spécifique plus efficace lors d’une rencontre ultérieure.", "strict": false}, {"id": "3e-sci-2-q2", "prompt": "Les antibiotiques agissent contre…", "answer": "certaines bactéries", "options": ["certaines bactéries", "tous les virus", "toutes les maladies génétiques"], "explanation": "Ils ciblent des bactéries ; ils ne traitent pas les infections virales.", "strict": false}, {"id": "3e-sci-2-q3", "prompt": "Quel gaz contribue au renforcement de l’effet de serre lorsqu’il augmente dans l’atmosphère ?", "answer": "dioxyde de carbone", "options": ["dioxyde de carbone", "dioxygène uniquement", "hélium uniquement"], "explanation": "L’augmentation du CO₂ contribue au réchauffement climatique actuel.", "strict": false}, {"id": "3e-sci-2-q4", "prompt": "Pour tester l’effet d’un facteur, on compare…", "answer": "des situations ne différant que par ce facteur", "options": ["des situations ne différant que par ce facteur", "des résultats sans témoin", "des opinions seulement"], "explanation": "Un protocole contrôlé aide à isoler l’influence du facteur étudié.", "strict": false}]}, {"id": "3e-sci-3", "grade": "3e", "subject": "sci", "title": "Technologie et démarche scientifique", "body": "Un système technique répond à un besoin et à des contraintes. La chaîne d’information acquiert, traite et communique ; la chaîne d’énergie alimente, distribue, convertit et transmet. Un algorithme décrit une suite d’instructions.", "example": "Dans un éclairage automatique, le capteur mesure la luminosité et le programme décide de commander la lampe.", "widget": "", "stage": 3, "questions": [{"id": "3e-sci-3-q0", "prompt": "Un capteur sert principalement à…", "answer": "acquérir une information", "options": ["acquérir une information", "stocker uniquement de l’énergie", "remplacer toute programmation"], "explanation": "Il transforme une grandeur physique en information exploitable.", "strict": false}, {"id": "3e-sci-3-q1", "prompt": "Un moteur électrique convertit…", "answer": "l’énergie électrique en énergie mécanique", "options": ["l’énergie électrique en énergie mécanique", "l’eau en carburant", "une donnée en texte seulement"], "explanation": "Il produit un mouvement à partir d’énergie électrique.", "strict": false}, {"id": "3e-sci-3-q2", "prompt": "Dans un programme, une condition permet de…", "answer": "choisir une action selon un test", "options": ["choisir une action selon un test", "répéter toujours exactement dix fois", "supprimer les variables"], "explanation": "Une instruction conditionnelle exécute une branche selon un résultat vrai ou faux.", "strict": false}, {"id": "3e-sci-3-q3", "prompt": "Une contrainte de conception peut être…", "answer": "un coût maximal", "options": ["un coût maximal", "le nom du créateur seulement", "une rumeur"], "explanation": "Le coût, la sécurité et l’impact environnemental sont des contraintes possibles.", "strict": false}, {"id": "3e-sci-3-q4", "prompt": "Pourquoi citer l’unité d’une mesure ?", "answer": "pour interpréter correctement la valeur", "options": ["pour interpréter correctement la valeur", "pour décorer la réponse", "pour éviter tout calcul"], "explanation": "Une valeur sans unité peut être ambiguë et inexploitable.", "strict": false}]}, {"id": "3e-oral-0", "grade": "3e", "subject": "oral", "title": "Choisir un projet et construire le plan", "body": "L’oral présente un projet réellement mené dans le cadre prévu par le collège. Explique le contexte, la problématique, ta démarche, ton rôle et ce que tu as appris. Les consignes de ton établissement restent prioritaires.", "example": "Plan possible : pourquoi ce projet ? comment l’ai-je mené ? quel bilan personnel ?", "widget": "", "stage": 0, "questions": [{"id": "3e-oral-0-q0", "prompt": "Quel projet choisir pour l’oral ?", "answer": "un projet réellement mené dans le cadre prévu par le collège", "options": ["un projet réellement mené dans le cadre prévu par le collège", "un projet inventé", "une vidéo copiée"], "explanation": "L’oral s’appuie sur un travail authentique et ta capacité à l’expliquer.", "strict": false}, {"id": "3e-oral-0-q1", "prompt": "Une problématique sert à…", "answer": "guider la réflexion", "options": ["guider la réflexion", "remplacer toute conclusion", "lister seulement les dates"], "explanation": "Une question directrice relie les différentes étapes de la présentation.", "strict": false}, {"id": "3e-oral-0-q2", "prompt": "Pourquoi préciser son rôle personnel ?", "answer": "pour montrer sa contribution", "options": ["pour montrer sa contribution", "pour cacher le travail collectif", "pour éviter les questions"], "explanation": "Le jury doit comprendre ce que tu as fait et appris personnellement.", "strict": false}, {"id": "3e-oral-0-q3", "prompt": "Une conclusion utile présente…", "answer": "un bilan et ce que tu as appris", "options": ["un bilan et ce que tu as appris", "de nouvelles informations sans lien", "seulement merci"], "explanation": "La conclusion répond à la question directrice et prend du recul.", "strict": false}, {"id": "3e-oral-0-q4", "prompt": "À qui vérifier les consignes locales de l’oral ?", "answer": "à l’équipe du collège", "options": ["à l’équipe du collège", "à une publicité", "à un compte anonyme"], "explanation": "Le collège précise l’organisation et les projets recevables.", "strict": false}]}, {"id": "3e-oral-1", "grade": "3e", "subject": "oral", "title": "Parler, expliquer et répondre", "body": "Parle distinctement, regarde ton auditoire et organise ton propos. Le support accompagne la parole ; il ne la remplace pas. À une question, prends le temps de comprendre et réponds en argumentant, sans inventer si tu ne sais pas.", "example": "Si une question est ambiguë, demande une reformulation. Pour illustrer une idée, raconte une étape concrète de ton projet.", "widget": "", "stage": 1, "questions": [{"id": "3e-oral-1-q0", "prompt": "Un diaporama efficace contient plutôt…", "answer": "des repères lisibles et des visuels utiles", "options": ["des repères lisibles et des visuels utiles", "tout le discours en petits caractères", "des animations permanentes"], "explanation": "Le support guide et illustre ; il ne remplace pas la présentation orale.", "strict": false}, {"id": "3e-oral-1-q1", "prompt": "Si tu ne comprends pas une question, tu peux…", "answer": "demander une reformulation", "options": ["demander une reformulation", "répondre au hasard", "ignorer le jury"], "explanation": "Demander une précision permet de répondre à la bonne question.", "strict": false}, {"id": "3e-oral-1-q2", "prompt": "Pour progresser à l’oral, il est utile de…", "answer": "s’enregistrer puis repérer un point à améliorer", "options": ["s’enregistrer puis repérer un point à améliorer", "apprendre sans jamais parler", "lire seulement ses diapositives"], "explanation": "Une répétition à voix haute rend les difficultés visibles.", "strict": false}, {"id": "3e-oral-1-q3", "prompt": "Si tu ignores une réponse, mieux vaut…", "answer": "le reconnaître puis raisonner avec ce que tu sais", "options": ["le reconnaître puis raisonner avec ce que tu sais", "inventer une source", "affirmer une réponse au hasard"], "explanation": "L’honnêteté et le raisonnement valent mieux qu’une invention.", "strict": false}, {"id": "3e-oral-1-q4", "prompt": "Comment montrer une compétence acquise ?", "answer": "décrire une action et son résultat", "options": ["décrire une action et son résultat", "dire seulement je suis forte", "lister des mots sans explication"], "explanation": "Un exemple concret rend ton apprentissage observable.", "strict": false}]}, {"id": "3e-oral-2", "grade": "3e", "subject": "oral", "title": "Méthode de travail et mémorisation", "body": "Répartis les révisions en séances courtes. Essaie de retrouver une réponse avant de relire : c’est le rappel actif. Reviens sur les erreurs après un délai. Préserve sommeil et pauses ; le nombre d’heures seul ne mesure pas l’efficacité.", "example": "Après une fiche : ferme-la, note trois idées de mémoire, vérifie, puis programme un nouveau rappel.", "widget": "", "stage": 2, "questions": [{"id": "3e-oral-2-q0", "prompt": "Le rappel actif consiste à…", "answer": "retrouver de mémoire avant de vérifier", "options": ["retrouver de mémoire avant de vérifier", "relire dix fois sans réfléchir", "surligner toutes les lignes"], "explanation": "L’effort de récupération permet de repérer ce qui est réellement retenu.", "strict": false}, {"id": "3e-oral-2-q1", "prompt": "Après une erreur, il est utile de…", "answer": "comprendre la cause et réessayer plus tard", "options": ["comprendre la cause et réessayer plus tard", "effacer toute la leçon", "arrêter définitivement la matière"], "explanation": "La correction devient utile quand tu peux expliquer et refaire la démarche.", "strict": false}, {"id": "3e-oral-2-q2", "prompt": "Un objectif de séance précis serait…", "answer": "résoudre trois équations et vérifier mes étapes", "options": ["résoudre trois équations et vérifier mes étapes", "tout savoir ce soir", "ouvrir mon cahier"], "explanation": "Un objectif concret permet de vérifier ce qui a été accompli.", "strict": false}, {"id": "3e-oral-2-q3", "prompt": "Pourquoi espacer les révisions ?", "answer": "pour consolider les connaissances dans le temps", "options": ["pour consolider les connaissances dans le temps", "pour tout oublier volontairement", "pour éviter de travailler"], "explanation": "Revenir sur une notion après un délai renforce sa disponibilité.", "strict": false}, {"id": "3e-oral-2-q4", "prompt": "La veille d’une épreuve, il faut aussi…", "answer": "préparer son matériel et préserver son sommeil", "options": ["préparer son matériel et préserver son sommeil", "réviser toute la nuit", "supprimer toutes les pauses"], "explanation": "L’organisation et le repos soutiennent l’attention.", "strict": false}]}, {"id": "3e-oral-3", "grade": "3e", "subject": "oral", "title": "Analyser une consigne et se relire", "body": "Repère le verbe de consigne : décrire, expliquer, justifier ou démontrer ne demandent pas la même action. En sciences, affiche les étapes et les unités. En histoire-géographie, mobilise des repères précis et localisés.", "example": "Justifier une réponse consiste à donner une raison ou une preuve pertinente, pas à répéter la réponse.", "widget": "", "stage": 3, "questions": [{"id": "3e-oral-3-q0", "prompt": "Justifier signifie…", "answer": "donner une preuve ou une raison pertinente", "options": ["donner une preuve ou une raison pertinente", "répéter la question", "écrire plus gros"], "explanation": "La justification rend ton raisonnement vérifiable.", "strict": false}, {"id": "3e-oral-3-q1", "prompt": "Décrire un graphique demande d’abord de…", "answer": "identifier axes, unités et variations", "options": ["identifier axes, unités et variations", "inventer une cause", "ignorer la légende"], "explanation": "La lecture des axes et unités précède l’interprétation.", "strict": false}, {"id": "3e-oral-3-q2", "prompt": "Pour une réponse numérique, il faut vérifier…", "answer": "l’unité et l’ordre de grandeur", "options": ["l’unité et l’ordre de grandeur", "la couleur du stylo seulement", "le nombre de phrases uniquement"], "explanation": "Ces vérifications permettent de détecter de nombreuses erreurs.", "strict": false}, {"id": "3e-oral-3-q3", "prompt": "Une source doit être citée pour…", "answer": "permettre de retrouver et évaluer l’information", "options": ["permettre de retrouver et évaluer l’information", "allonger le texte", "prouver automatiquement toute affirmation"], "explanation": "Citer permet la vérification ; la qualité de la source doit encore être évaluée.", "strict": false}, {"id": "3e-oral-3-q4", "prompt": "Une relecture efficace vérifie…", "answer": "la réponse à la consigne et la clarté des étapes", "options": ["la réponse à la consigne et la clarté des étapes", "uniquement les titres", "uniquement le nom"], "explanation": "La pertinence, le raisonnement et la langue comptent ensemble.", "strict": false}]}];

function validateState(raw){
 if(!raw||raw.version!==1||!Array.isArray(raw.profiles)||!raw.profiles.length||raw.profiles.length>12)throw Error('Format de sauvegarde non reconnu.');
 const ids=new Set();

  if(!p||typeof p.id!=='string'||p.id.length>100||ids.has(p.id)||typeof p.name!=='string'||p.name.length<1||p.name.length>24||!['3e'].includes(p.grade))throw Error('Profil invalide.');ids.add(p.id);
  if(!Number.isSafeInteger(p.xp)||p.xp<0||p.xp>100000)throw Error('Points invalides.');
  const n={oralNotes:typeof p.oralNotes==='string'?p.oralNotes.slice(0,15000):'',...newProfile(),id:p.id,name:p.name,grade:p.grade,xp:p.xp};
  for(const [id,b]of Object.entries(p.best||{})){if(LESSONS.some(l=>l.id===id)&&Number.isInteger(b.stars)&&b.stars>=0&&b.stars<=3&&Number.isInteger(b.score)&&b.score>=0&&b.score<=5)n.best[id]={stars:b.stars,score:b.score};}
  for(const[id,m]of Object.entries(p.mastery||{})){if(QUESTION_MAP.has(id)&&Number.isSafeInteger(m.attempts)&&m.attempts>0&&m.attempts<=100000&&Number.isSafeInteger(m.correct)&&m.correct>=0&&m.correct<=m.attempts&&typeof m.lastCorrect==='boolean')n.mastery[id]={attempts:m.attempts,correct:m.correct,lastCorrect:m.lastCorrect};}
  n.history=(Array.isArray(p.history)?p.history:[]).filter(h=>h&&typeof h.mode==='string'&&typeof h.title==='string'&&Number.isFinite(h.score)&&Number.isFinite(h.total)&&h.score>=0&&h.score<=h.total&&h.total<=40&&Number.isFinite(Date.parse(h.date))).slice(0,100).map(h=>({mode:h.mode.slice(0,30),title:h.title.slice(0,100),score:h.score,total:h.total,date:h.date}));
  n.seasonWins=(Array.isArray(p.seasonWins)?p.seasonWins:[]).filter(s=>['halloween','noel'].includes(s));
  const t=p.session;if(t&&['career','practice','review'].includes(t.mode)&&Array.isArray(t.ids)&&t.ids.length>0&&t.ids.length<=20&&t.ids.every(id=>QUESTION_MAP.has(id))&&Number.isInteger(t.index)&&t.index>=0&&t.index<t.ids.length&&Array.isArray(t.answers)&&t.answers.length===t.index+(t.answered?1:0)&&t.answers.every(a=>a&&typeof a.correct==='boolean'&&typeof a.given==='string'&&a.given.length<500)&&t.answers.every((a,i)=>a.id===t.ids[i])&&(!t.lessonId||LESSONS.some(l=>l.id===t.lessonId))){n.session={mode:t.mode,ids:t.ids,index:t.index,answers:t.answers,answered:!!t.answered,title:String(t.title||'Révision').slice(0,100),lessonId:t.lessonId||null,written:!!t.written,xpEarned:Number.isFinite(t.xpEarned)?Math.max(0,Math.min(500,t.xpEarned)):0};}
  return n;
 });return{version:1,active:ids.has(raw.active)?raw.active:profiles[0].id,profiles};
}

function renderLessons(){main.innerHTML=head('La bibliothèque des savoirs','Lis, écoute, manipule… puis essaie à ton rythme.')+`<div class="toolbar"><label>Matière<select id="lesson-subject">${subjectOptions()}</select></label><label>Rechercher une leçon<input id="lesson-search" type="search" placeholder="Ex. : fractions…" autocomplete="off"></label><button data-action="resources">Vidéos et ressources ↗</button></div><div id="lesson-results" class="lesson-grid"></div>${footer()}`;filterLessons();}
function filterLessons(){const sub=$('#lesson-subject').value,q=normalize($('#lesson-search').value);const ls=gradeLessons().filter(l=>(sub==='all'||l.subject===sub)&&normalize(l.title+' '+l.body).includes(q));$('#lesson-results').innerHTML=ls.length?ls.map(l=>`<article class="card lesson-card"><span class="tag" style="color:${SUBJECTS[l.subject].color}">${SUBJECTS[l.subject].name} · étape ${l.stage+1}</span><h2 style="margin-top:14px">${escapeHTML(l.title)}</h2><p>${escapeHTML(l.body)}</p><button data-action="lesson" data-id="${l.id}">Ouvrir et manipuler →</button></article>`).join(''):'<p>Aucune leçon trouvée. Essaie un autre mot.</p>';}
function renderTournament(){main.innerHTML=head('Le tournoi des explorateurs','2 à 4 joueurs, chacun son tour sur la même tablette.')+`<form id="tournament-form" class="card text-width"><h2>Préparer la rencontre</h2><p class="muted">Même classe, même matière et même difficulté pour tous. Deux questions différentes par joueur, tirées au sort dans le même groupe. 10 points par bonne réponse, sans bonus de vitesse. En cas d’égalité, la victoire est partagée.</p><div class="toolbar"><label>Nombre de joueurs<select id="players-count" name="count"><option>2</option><option>3</option><option>4</option></select></label><label>Matière<select name="subject">${subjectOptions(false)}</select></label><label>Difficulté<select name="difficulty"><option value="0">Bases · étapes 1–2</option><option value="1">Consolidation · étapes 3–4</option></select></label></div><div id="player-names" class="form-grid"></div><p id="tournament-error" role="status" class="danger"></p><p class="small muted" style="margin-top:18px">À quatre joueurs, la séance comprend 8 questions. Chaque question est utilisée une seule fois pendant la rencontre. Le score du tournoi n’ajoute pas de XP au profil. Les questions restent de difficulté comparable, sans garantie d’équivalence parfaite.</p><button class="primary" type="submit">Lancer le tournoi →</button></form>${footer()}`;renderPlayerNames();}
function renderPlayerNames(){const el=$('#player-names');const old=[...el.querySelectorAll('input')].map(x=>x.value);el.innerHTML=Array.from({length:+$('#players-count').value},(_,i)=>`<label>Joueur ${i+1}<input name="player${i}" maxlength="24" value="${escapeHTML(old[i]||('Joueur '+(i+1)))}" required autocomplete="off"></label>`).join('');}
function renderProgress(){const p=profile(),ls=gradeLessons(),done=ls.filter(l=>stars(l.id)>0).length,totalStars=ls.reduce((n,l)=>n+stars(l.id),0),ms=Object.entries(p.mastery).filter(([id])=>QUESTION_MAP.get(id)?.grade===p.grade);const correct=ms.reduce((n,[,m])=>n+m.correct,0),attempts=ms.reduce((n,[,m])=>n+m.attempts,0);main.innerHTML=head('Ton carnet de progression','Les petits pas font les grandes aventures.')+`<div class="stat-grid"><div class="card stat"><strong>${1+Math.floor(p.xp/100)}</strong><p>Niveau global<br>${p.xp} XP</p></div><div class="card stat"><strong>${done} / 20</strong><p>Missions ${p.grade}<br>${totalStars} / 60 étoiles</p></div><div class="card stat"><strong>${attempts?Math.round(correct/attempts*100)+' %':'—'}</strong><p>Réponses justes en ${p.grade}<br>${attempts} réponses données</p></div></div><div class="card"><h2>Tes badges</h2><div class="badge-list">${[['⛵ Premier pas',p.xp>=10],['🌟 Curieux',p.xp>=100],['🧭 Explorateur',p.xp>=500],['🏝 Toutes les matières',Object.keys(SUBJECTS).every(s=>ls.some(l=>l.subject===s&&stars(l.id)>0))],['Méthodes validées',ls.filter(l=>l.subject==='oral').every(l=>stars(l.id)>0)]].map(([t,on])=>`<div class="badge ${on?'earned':''}">${t}${on?' ✓':' · à découvrir'}</div>`).join('')}</div></div><section class="card" style="margin-top:20px"><h2>Le carnet des matières</h2><div class="table-wrap"><table><thead><tr><th>Matière</th><th>Missions réussies</th><th>Étoiles</th></tr></thead><tbody>${Object.entries(SUBJECTS).map(([s,o])=>`<tr><th>${o.name}</th><td>${ls.filter(l=>l.subject===s&&stars(l.id)>0).length} / 4</td><td>${ls.filter(l=>l.subject===s).reduce((n,l)=>n+stars(l.id),0)} / 12</td></tr>`).join('')}</tbody></table></div></section><section class="card" style="margin-top:20px"><h2>Dernières séances</h2>${p.history.length?`<div class="scroll-list">${p.history.slice(0,10).map(h=>`<div><b>${escapeHTML(h.title)}</b> · ${h.score}/${h.total}<br><span class="small muted">${new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium'}).format(new Date(h.date))} · ${escapeHTML(h.mode)}</span></div>`).join('')}</div>`:'<p>Ton carnet se remplira après ta première séance.</p>'}</section>${footer()}`;}
function renderSettings(){const p=profile();main.innerHTML=head('Le camp de base','Profils, sauvegardes et mode d’emploi.')+`<div class="form-grid"><section class="card"><h2>Ton profil</h2><form id="rename-form"><label>Ton surnom<input name="name" value="${escapeHTML(p.name)}" maxlength="24" required autocomplete="nickname"></label><button type="submit" style="margin-top:12px">Enregistrer le surnom</button></form><div class="toolbar"><button data-action="profiles">Changer de profil</button><button data-action="new-profile">Créer un profil</button></div><p class="small muted">Jusqu’à 12 profils indépendants sur cet appareil. Un surnom suffit.</p></section><section class="card"><h2>Emporter tes progrès</h2><p>La sauvegarde automatique reste dans ce navigateur. Exporte un fichier pour la déplacer ou la conserver.</p><div class="toolbar"><button class="primary" data-action="export">Exporter les progrès</button><button data-action="import">Importer une sauvegarde</button><input id="import-file" class="hidden" type="file" accept="application/json,.json" aria-label="Fichier de sauvegarde"></div><p class="small muted">L’import remplace les profils actuels après confirmation. Pense à les exporter d’abord.</p></section><section class="card"><h2>Comment ça marche ?</h2><p>Une mission de carrière comporte 5 questions : 3 bonnes réponses donnent 1 étoile, 4 donnent 2 étoiles, 5 donnent 3 étoiles.</p><p>Chaque première bonne réponse à une question rapporte 10 XP. Un niveau est gagné tous les 100 XP.</p><p class="small muted">Les étoiles ouvrent les étapes, les XP indiquent le niveau global. Les leçons et l’entraînement sont toujours accessibles.</p></section><section class="card"><h2>À propos de cette édition</h2><p>20 modules, 100 questions originales, ${Object.keys(DICTIONARY).length} entrées de lexique et un carnet de préparation à l’oral.</p><p class="small muted">Sélection de révisions, édition du 30 octobre 2026. Entraînements courts, sans notation officielle : complète avec des annales, des rédactions et des exercices développés.</p><div class="toolbar"><button data-action="sources">Sources et périmètre</button><button data-action="resources">Ressources en ligne ↗</button></div><button class="danger" data-action="reset-profile">Réinitialiser ce profil</button></section></div>${footer()}`;}
function normalize(s,strict=false){let n=String(s).trim().toLowerCase().normalize('NFC').replace(/[’‘]/g,"'").replace(/\s+/g,' ');if(!strict)n=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return n;}
function answerMatches(given,q){const a=normalize(given,q.strict),b=normalize(q.answer,q.strict);const num=s=>{if(!/^[+-]?\d[\d\s]*(?:[.,]\d+)?$/.test(s))return null;return Number(s.replace(/\s/g,'').replace(',','.'));};const x=num(a),y=num(b);return x!==null&&y!==null?x===y:a===b;}
function persistGame(){if(game&&game.mode!=='tournament'&&game.mode!=='noel'){const{mode,ids,index,answers,answered,title,lessonId,written,xpEarned}=game;profile().session={mode,ids,index,answers,answered,title,lessonId,written,xpEarned};save();}}
function begin(spec){const launch=()=>{game={index:0,answers:[],answered:false,xpEarned:0,written:false,...spec};page='game';persistGame();render();};if(profile().session&&spec.mode!=='tournament'&&spec.mode!=='noel')confirmAction('Commencer une nouvelle séance ?','La séance en pause sera remplacée. Tes points et tes réponses déjà enregistrées sont conservés.',launch);else launch();}
function startMission(id){const l=LESSONS.find(x=>x.id===id);if(!l||l.grade!==profile().grade||!unlocked(l))return;begin({mode:'career',ids:shuffle(l.questions.map(q=>q.id)),title:l.title,lessonId:l.id});}
function resume(){const s=profile().session;if(!s)return;game=structuredClone(s);page='game';render();}
function renderGame(){const g=game;if(!g){page='home';render();return;}if(g.mode==='tournament'&&g.handoff){renderHandoff();return;}const q=QUESTION_MAP.get(g.ids[g.index]);const l=LESSONS.find(l=>l.id===q.lessonId);const turn=g.mode==='tournament'?g.index%g.players.length:null;const ans=g.answers[g.index];if(!g.optionOrder)g.optionOrder=shuffle(q.options);main.innerHTML=`<div class="game"><div class="game-top"><button data-action="leave-game">${g.mode==='tournament'?'Quitter':'Mettre en pause'}</button><span>${g.mode==='tournament'?escapeHTML(g.players[turn])+' · ':''}Question ${g.index+1} / ${g.ids.length}</span><span class="tag">${g.mode==='career'?'Carrière':g.mode==='tournament'?'Tournoi':g.mode==='review'?'À revoir':g.mode==='noel'?'Noël':'Entraînement'}</span></div><div class="progress" style="margin-bottom:20px;height:10px"><span style="width:${g.index/g.ids.length*100}%"></span></div><article class="card question"><span class="tag" style="color:${SUBJECTS[q.subject].color}">${SUBJECTS[q.subject].name} · ${q.grade}</span><h2 id="question-title" tabindex="-1">${escapeHTML(q.prompt)}</h2>${g.written?`<form id="answer-form" class="answer-form"><label for="written-answer" class="hidden">Ta réponse</label><input id="written-answer" name="answer" aria-label="Ta réponse" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="250" placeholder="Écris ta réponse…" value="${escapeHTML(ans?.given||'')}" ${g.answered?'disabled':''} required><button type="submit" class="primary" ${g.answered?'disabled':''}>Valider</button></form><p class="small muted" style="margin-top:12px">Réponse courte attendue${q.strict?' · accents et accords vérifiés':''}.</p>`:`<div class="options">${g.optionOrder.map((o,i)=>`<button class="option ${g.answered&&o===q.answer?'correct':''} ${g.answered&&o===ans?.given&&!ans.correct?'incorrect':''}" data-action="answer" data-value="${escapeHTML(o)}" ${g.answered?'disabled':''}><b>${String.fromCharCode(65+i)}</b><span>${escapeHTML(o)}</span>${g.answered&&o===q.answer?'<span aria-label="Bonne réponse">✓</span>':''}</button>`).join('')}</div>`}${g.answered?`<section class="feedback ${ans.correct?'':'wrong'}" role="status"><h3>${ans.correct?'✓ Bien joué !':'On apprend en essayant !'}</h3>${!ans.correct?`<p>La réponse attendue est <b>${escapeHTML(q.answer)}</b>.</p>`:''}<p>${escapeHTML(q.explanation)}</p><div class="actions">${g.mode!=='tournament'?`<button data-action="lesson" data-id="${l.id}">Comprendre avec la leçon</button>`:''}<button class="primary" data-action="next">${g.index===g.ids.length-1?'Voir le résultat':'Continuer →'}</button></div></section>`:''}</article><div class="support"><button data-action="speak-question">🔊 Écouter la question</button>${g.mode!=='tournament'?'<button data-action="slate">✎ Ardoise</button><button data-action="dictionary">Aa Dictionnaire</button>':''}</div><p class="small muted" style="margin-top:15px">${g.mode==='tournament'?'Passe la tablette au joueur annoncé entre chaque question.':g.mode==='noel'?'Les calculs étoilés : un défi sans chronomètre.':'Pas de compte à rebours. Prends le temps de réfléchir.'}</p></div>`;}
function giveAnswer(given){const g=game;if(!g||g.answered||!String(given).trim())return;const q=QUESTION_MAP.get(g.ids[g.index]),correct=answerMatches(given,q);g.answered=true;g.answers.push({id:q.id,given:String(given),correct});if(g.mode!=='tournament'&&g.mode!=='noel'){const m=profile().mastery[q.id]||{attempts:0,correct:0,lastCorrect:false};if(correct&&m.correct===0){profile().xp+=10;g.xpEarned+=10;}m.attempts++;m.correct+=+correct;m.lastCorrect=correct;profile().mastery[q.id]=m;persistGame();}renderGame();save();$('.feedback')?.scrollIntoView({block:'nearest',behavior:'auto'});}
function nextQuestion(){if(!game?.answered)return;if(game.index+1>=game.ids.length){finishGame();return;}game.index++;game.answered=false;game.optionOrder=null;if(game.mode==='tournament')game.handoff=true;persistGame();renderGame();main.focus({preventScroll:true});window.scrollTo(0,0);}
function finishGame(){const g=game,score=g.answers.filter(a=>a.correct).length,p=profile();if(g.mode==='tournament'){const scores=g.players.map((name,i)=>({name,score:g.answers.filter((a,j)=>j%g.players.length===i&&a.correct).length*10}));lastResult={...g,score,scores};}else{let earnedStars=0;if(g.mode==='career'){earnedStars=score===5?3:score===4?2:score>=3?1:0;const b=p.best[g.lessonId]||{stars:0,score:0};p.best[g.lessonId]={stars:Math.max(b.stars,earnedStars),score:Math.max(b.score,score)};}if(g.mode==='noel'&&score>=3&&!p.seasonWins.includes('noel')){p.seasonWins.push('noel');p.xp+=20;g.xpEarned=20;}p.history.unshift({mode:g.mode==='career'?'Carrière':g.mode==='review'?'À revoir':g.mode==='noel'?'Défi de Noël':'Entraînement',title:g.title,score,total:g.ids.length,date:new Date().toISOString()});p.history=p.history.slice(0,100);if(g.mode!=='noel')p.session=null;lastResult={...g,score,earnedStars};}game=null;page='result';save();render();}
function renderResult(){const r=lastResult;if(!r){page='home';render();return;}const tour=r.mode==='tournament';const top=tour?Math.max(...r.scores.map(x=>x.score)):0;const winners=tour?r.scores.filter(x=>x.score===top).map(x=>x.name):[];main.innerHTML=`<div class="game"><section class="card result celebrate"><div class="trophy" aria-hidden="true">${tour?'🏆':r.score>=3?'🌟':'⛵'}</div><h1>${tour?'Défi terminé !':r.score>=3?'Objectif atteint !':'Chaque essai te fait avancer'}</h1><p>${tour?escapeHTML(winners.join(' et '))+(winners.length>1?' partagent la victoire.':' remporte le tournoi.'):`${r.score} bonne${r.score>1?'s':''} réponse${r.score>1?'s':''} sur ${r.ids.length} · +${r.xpEarned||0} XP`}</p>${r.mode==='career'?`<div class="stars" aria-label="${r.earnedStars} étoiles">${'★'.repeat(r.earnedStars)}${'☆'.repeat(3-r.earnedStars)}</div><p>${r.earnedStars?'Une étoile suffit pour ouvrir la suite du parcours.':'Relis la leçon, puis réessaie : 3 bonnes réponses ouvrent la suite.'}</p>`:''}${tour?`<ol class="results-list">${[...r.scores].sort((a,b)=>b.score-a.score).map(x=>`<li>${escapeHTML(x.name)} <b style="float:right">${x.score} points</b></li>`).join('')}</ol>`:''}<div class="toolbar" style="justify-content:center"><button class="primary" data-action="nav" data-value="${tour?'tournament':'home'}">${tour?'Préparer un autre tournoi':'Retour au parcours'}</button>${r.lessonId?`<button data-action="lesson" data-id="${r.lessonId}">Relire la leçon</button>`:''}<button data-action="nav" data-value="practice">S’entraîner</button></div></section><h2 style="margin-top:25px">Le carnet des réponses</h2><ul class="results-list">${r.answers.map(a=>{const q=QUESTION_MAP.get(a.id);return`<li><strong>${a.correct?'✓':'↻'} ${escapeHTML(q.prompt)}</strong><p class="small">Ta réponse : ${escapeHTML(a.given)}<br>Réponse attendue : <b>${escapeHTML(q.answer)}</b></p><p class="small muted">${escapeHTML(q.explanation)}</p></li>`;}).join('')}</ul></div>`;}
function prepareTournament(form){
 const f=new FormData(form),n=+f.get('count'),players=Array.from({length:n},(_,i)=>String(f.get('player'+i)).trim());
 if(players.some(p=>!p)||new Set(players.map(p=>normalize(p))).size!==players.length){$('#tournament-error').textContent='Choisis un surnom différent pour chaque joueur.';return;}
 const sub=f.get('subject'),diff=+f.get('difficulty');
 const ids=shuffle([...QUESTION_MAP.values()].filter(q=>q.grade===profile().grade&&q.subject===sub&&Math.floor(q.stage/2)===diff)).slice(0,2*n).map(q=>q.id);
 begin({mode:'tournament',ids,title:'Tournoi '+SUBJECTS[sub].name,players,handoff:true,chosenDifficulty:diff});
}
function renderHandoff(){const g=game,who=g.index%g.players.length;main.innerHTML=`<div class="card pending-player"><div style="font-size:4rem" aria-hidden="true">🏆</div><h1>À toi, ${escapeHTML(g.players[who])} !</h1><p>Passe la tablette à ce joueur.</p><p class="muted">Tour ${Math.floor(g.index/g.players.length)+1} sur 2 · ${SUBJECTS[QUESTION_MAP.get(g.ids[g.index]).subject].name}</p><button class="primary" data-action="ready">Je suis prêt !</button><div class="toolbar" style="justify-content:center"><button data-action="leave-game">Quitter le tournoi</button></div></div>`;}
function openModal(title,html,setup){closeModal(false);$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;modal.showModal();setup?.();}
function closeModal(doClose=true){if(modalCleanup){modalCleanup();modalCleanup=null;}if(doClose&&modal.open)modal.close();if(globalThis.speechSynthesis)speechSynthesis.cancel();}
modal.addEventListener('close',()=>closeModal(false));
function confirmAction(title,text,fn){openModal(title,`<p>${escapeHTML(text)}</p><div class="actions"><button data-action="close-modal">Annuler</button><button id="confirm-action" class="primary">Confirmer</button></div>`);$('#confirm-action').onclick=()=>{closeModal();fn();};}
function speak(text){if(!('speechSynthesis'in window)){toast('La lecture vocale n’est pas disponible dans ce navigateur. Le texte reste accessible.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.9;const voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('fr'));if(voice)u.voice=voice;speechSynthesis.speak(u);}
function openLesson(id){const l=LESSONS.find(x=>x.id===id);if(!l)return;openModal(l.title,`<span class="tag">${l.grade} · ${SUBJECTS[l.subject].name}</span><h3>À retenir</h3><p id="lesson-body">${escapeHTML(l.body)}</p><div class="example"><b>Un exemple</b><p style="margin:8px 0 0">${escapeHTML(l.example)}</p></div><div class="actions"><button id="listen-lesson">🔊 Écouter la leçon</button><button data-action="stop-speech">Arrêter la lecture</button></div><p class="small muted">La voix française dépend de l’appareil. Le texte affiché sert aussi de transcription.</p><div id="widget" class="widget"></div><div class="actions"><button id="related-media">Vidéos et ressources ↗</button><button data-action="close-modal" class="primary">J’ai compris</button></div>`,()=>{$('#listen-lesson').onclick=()=>speak(l.title+'. '+l.body+' '+l.example);$('#related-media').onclick=()=>openResources(l.subject);$('#widget').innerHTML=l.subject==='oral'?'<button data-action="oral-notes">Ouvrir mon carnet d’oral</button>':'';});}
function openResources(sub){const ms=MEDIA.filter(m=>!sub||m.subject===sub);openModal('Vidéos et ressources',`<p>Ces compléments s’ouvrent sur leur site d’origine. Une connexion est nécessaire ; leur lecture peut dépendre du pays ou des conditions du site.</p><p class="small muted">Aucune vidéo externe n’est chargée automatiquement. Les fiches et leurs textes restent disponibles hors ligne.</p><div class="lesson-grid">${ms.map(m=>`<article class="card"><h3>${escapeHTML(m.title)}</h3><p class="small muted">${m.note}</p><a href="${m.url}" target="_blank" rel="noopener noreferrer">Ouvrir la ressource ↗</a></article>`).join('')}</div>`);}
function openSources(){openModal('Brevet général · repères 2027',`<p>Pour les candidats scolaires : contrôle continu 40 %, épreuves terminales 60 %. Les sujets écrits portent sur les programmes de troisième en vigueur, ou à défaut ceux du cycle 4.</p><p>Cette sélection originale propose 100 questions et 20 fiches. Elle ne couvre pas tous les attendus et ne simule pas une épreuve officielle. Les trois disciplines scientifiques sont révisées sans présumer du choix des disciplines à l’examen.</p><p><a href="https://www.education.gouv.fr/bo/2026/Special4/MENE2623194N" target="_blank" rel="noopener">Modalités officielles 2027 ↗</a></p><p><a href="https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N" target="_blank" rel="noopener">Définition officielle des épreuves ↗</a></p><p>Consultation : 30 octobre 2026. Confirme les consignes de l’oral avec ton collège. Aucun compte ni suivi publicitaire. Les points du jeu ne sont pas une estimation de ta note au brevet.</p>`);}
function openDictionary(){openModal('Le petit dictionnaire',`<label for="dict-search">Cherche un mot du lexique scolaire</label><input id="dict-search" type="search" autocomplete="off" placeholder="Ex. : fraction, siècle…" style="width:100%;margin-top:10px"><p class="small muted">${Object.keys(DICTIONARY).length} définitions hors ligne · recherche avec ou sans accent.</p><div id="dict-results" class="word-results" aria-live="polite"></div>`,()=>{const update=()=>{const v=normalize($('#dict-search').value);const words=Object.entries(DICTIONARY).sort(([a],[b])=>a.localeCompare(b,'fr')).filter(([w])=>normalize(w).includes(v));$('#dict-results').innerHTML=words.length?words.slice(0,30).map(([w,d])=>`<article class="word-entry"><h3>${escapeHTML(w)}</h3><p>${escapeHTML(d)}</p></article>`).join('')+(words.length>30?`<p class="small muted">${words.length} résultats : précise le mot pour affiner.</p>`:''):'<p>Ce mot n’est pas dans le petit lexique. Demande à un adulte ou utilise le dictionnaire de l’école.</p>';};$('#dict-search').oninput=update;update();});}
function openProfiles(){openModal('Les profils',`<p>Choisis ton profil : chacun garde ses progrès.</p><div class="scroll-list">${state.profiles.map(p=>`<button data-action="select-profile" data-id="${escapeHTML(p.id)}">${escapeHTML(p.name)} · ${p.grade} · ${p.xp} XP ${p.id===state.active?'✓':''}</button>`).join('')}</div><div class="actions"><button data-action="new-profile" ${state.profiles.length>=12?'disabled':''}>Créer un profil</button></div>`);}
function openNewProfile(){if(state.profiles.length>=12){toast('Le maximum est de 12 profils.');return;}openModal('Un nouveau profil',`<form id="new-profile-form"><div class="form-grid"><label>Surnom<input name="name" required maxlength="24" autocomplete="off" placeholder="Ex. : Alix…"></label><label>Classe<select name="grade"><option>3e</option></select></label></div><button class="primary" type="submit" style="margin-top:18px">Créer mon profil</button></form>`);}
function download(name,blob){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportState(){persistGame();download('Cap_Brevet_progres_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));toast('Sauvegarde exportée. Conserve le fichier avec ton jeu.');}
async function importState(file){if(!file)return;if(file.size>2000000){toast('Ce fichier est trop volumineux pour une sauvegarde de jeu.');return;}try{const imported=validateState(JSON.parse(await file.text()));confirmAction('Remplacer les progrès de cet appareil ?',`${imported.profiles.length} profil(s) seront importés. Les profils actuels seront remplacés. Annule pour les exporter d’abord.`,()=>{state=imported;game=null;page='home';save();render();toast('Sauvegarde importée.');});}catch(e){toast('Fichier non reconnu ou endommagé. Les progrès actuels sont conservés.');}}
function openSlate(){openModal('Mon ardoise',`<div class="toolbar"><label>Couleur<input id="pen-color" type="color" value="#163f55"></label><label>Épaisseur<select id="pen-size"><option value="3">Fin</option><option value="6" selected>Moyen</option><option value="12">Épais</option></select></label><button id="pen-mode" aria-pressed="false">Gomme</button><button id="slate-undo">Annuler le trait</button><button id="slate-clear">Tout effacer</button></div><div class="slate-wrap"><canvas id="slate" aria-label="Zone de dessin à main levée, au doigt ou au stylet"></canvas></div><p class="small muted">Écris au doigt ou au stylet. Le dessin reste pendant cette ouverture du jeu ; il n’est pas reconnu comme une réponse au quiz. Utilise le clavier du quiz pour répondre.</p><label for="slate-text">Zone de notes au clavier</label><textarea id="slate-text" rows="2" style="display:block;width:100%" placeholder="Pose tes idées ici…"></textarea><div class="actions"><button id="slate-save">Télécharger le dessin PNG</button><button data-action="close-modal" class="primary">Retour au jeu</button></div>`,setupSlate);}
function setupSlate(){const canvas=$('#slate'),ctx=canvas.getContext('2d'),wrap=canvas.parentElement;let strokes=slateBackup?.strokes||[],notes=slateBackup?.notes||'',current=null,eraser=false,width=0,height=0,dpr=1;$('#slate-text').value=notes;
 const draw=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.strokeStyle='#e1e9ed';ctx.lineWidth=1;for(let y=30;y<height;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}for(const s of strokes){ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.size;ctx.lineJoin='round';ctx.lineCap='round';if(s.points.length===1){ctx.beginPath();ctx.arc(s.points[0].x*width,s.points[0].y*height,s.size/2,0,Math.PI*2);ctx.fill();}else{ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p.x*width,p.y*height):ctx.moveTo(p.x*width,p.y*height));ctx.stroke();}}};
 const resize=()=>{const r=wrap.getBoundingClientRect();width=r.width;height=r.height;dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);draw();};const observer=new ResizeObserver(resize);observer.observe(wrap);resize();
 const point=e=>{const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};};
 let pointer=null;canvas.onpointerdown=e=>{if(pointer!==null||e.button>0)return;pointer=e.pointerId;canvas.setPointerCapture(pointer);current={color:eraser?'#ffffff':$('#pen-color').value,size:eraser?24:+$('#pen-size').value,points:[point(e)]};strokes.push(current);draw();};canvas.onpointermove=e=>{if(!current||e.pointerId!==pointer)return;for(const p of e.getCoalescedEvents?.()||[e])current.points.push(point(p));draw();};const end=e=>{if(e.pointerId===pointer){current=null;pointer=null;}};canvas.onpointerup=end;canvas.onpointercancel=end;
 $('#pen-mode').onclick=()=>{eraser=!eraser;$('#pen-mode').setAttribute('aria-pressed',String(eraser));$('#pen-mode').textContent=eraser?'Reprendre le crayon':'Gomme';};$('#slate-undo').onclick=()=>{strokes.pop();draw();};$('#slate-clear').onclick=()=>{strokes=[];draw();};$('#slate-save').onclick=()=>canvas.toBlob(blob=>blob&&download('Cap_Brevet_ardoise.png',blob));modalCleanup=()=>{slateBackup={strokes,notes:$('#slate-text')?.value||''};observer.disconnect();};}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
 switch(a){case'oral-notes':openOralNotes();break;case'nav':go(v);break;case'subject':selectedSubject=v;go('subject');break;case'grade':if(v===profile().grade)break;if(page==='game'){toast('Termine ou mets la séance en pause avant de changer de classe.');break;}profile().grade=v;save();render();break;case'mission':startMission(id);break;case'resume':resume();break;case'answer':giveAnswer(v);break;case'next':nextQuestion();break;case'lesson':openLesson(id);break;case'close-modal':closeModal();break;case'dictionary':openDictionary();break;case'slate':openSlate();break;case'profiles':if(page==='game'){toast('Mets la séance en pause avant de changer de profil.');break;}openProfiles();break;case'settings':go('settings');break;case'resources':openResources();break;case'sources':openSources();break;case'stop-speech':if(globalThis.speechSynthesis)speechSynthesis.cancel();break;case'speak-question':if(game)speak(QUESTION_MAP.get(game.ids[game.index]).prompt);break;case'leave-game':if(game?.mode==='tournament')confirmAction('Quitter le tournoi ?','Ce tournoi ne sera pas conservé.',()=>{game=null;page='tournament';render();});else if(game?.mode==='noel'){game=null;page='season';render();}else{persistGame();game=null;page='home';render();}break;case'ready':game.handoff=false;renderGame();break;case'review':{const ids=shuffle(Object.keys(profile().mastery).filter(id=>QUESTION_MAP.get(id)?.grade===profile().grade&&!profile().mastery[id].lastCorrect)).slice(0,15);if(ids.length)begin({mode:'review',ids,title:'À revoir, pas à pas'});break;}case'export':exportState();break;case'import':$('#import-file').click();break;case'select-profile':state.active=id;closeModal();page='home';game=null;render();break;case'new-profile':openNewProfile();break;case'reset-profile':confirmAction('Remettre ce profil à zéro ?',`Les points et les missions de ${profile().name} seront effacés. Les autres profils seront conservés.`,()=>{const p=profile(),n=newProfile(p.name,p.grade);n.id=p.id;state.profiles[state.profiles.findIndex(x=>x.id===p.id)]=n;game=null;page='settings';render();});break;}
});
document.addEventListener('submit',e=>{const f=e.target;if(!['practice-form','tournament-form','answer-form','rename-form','new-profile-form'].includes(f.id))return;e.preventDefault();const d=new FormData(f);if(f.id==='practice-form'){const sub=d.get('subject'),diff=d.get('difficulty'),count=+d.get('count');const ids=shuffle([...QUESTION_MAP.values()].filter(q=>q.grade===profile().grade&&(sub==='all'||q.subject===sub)&&(diff==='all'||Math.floor(q.stage/2)===+diff))).slice(0,count).map(q=>q.id);begin({mode:'practice',ids,title:sub==='all'?'Toutes les matières':SUBJECTS[sub].name,written:d.get('written')==='true'});}if(f.id==='tournament-form')prepareTournament(f);if(f.id==='answer-form')giveAnswer(d.get('answer'));if(f.id==='rename-form'){const name=String(d.get('name')).trim();if(!name){toast('Écris un surnom.');return;}profile().name=name;save();render();toast('Surnom enregistré.');}if(f.id==='new-profile-form'){const name=String(d.get('name')).trim();if(!name){toast('Écris un surnom.');return;}if(state.profiles.length>=12)return;const p=newProfile(name,d.get('grade'));state.profiles.push(p);state.active=p.id;closeModal();page='home';render();}});
document.addEventListener('change',e=>{if(e.target.id==='players-count')renderPlayerNames();if(e.target.id==='lesson-subject')filterLessons();if(e.target.id==='import-file'){importState(e.target.files[0]);e.target.value='';}});
document.addEventListener('input',e=>{if(e.target.id==='lesson-search')filterLessons();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){persistGame();save();}});
window.addEventListener('pagehide',()=>{persistGame();save();});
render(false);

function openOralNotes(){openModal('Mon carnet d’oral',`<p>Prépare un plan personnel. Tes notes sont sauvegardées dans le profil et incluses dans l’export des progrès.</p><label for="oral-notes">Projet, problématique, démarche, rôle personnel, bilan et questions possibles</label><textarea id="oral-notes" rows="12" maxlength="15000" style="width:100%">${escapeHTML(profile().oralNotes||'')}</textarea><p class="small muted">Relis et répète à voix haute avec un proche. Le jeu ne note pas ton expression orale.</p><button data-action="close-modal" class="primary">Fermer le carnet</button>`,()=>{$('#oral-notes').oninput=()=>{profile().oralNotes=$('#oral-notes').value;save();}});}
</script></body></html>
